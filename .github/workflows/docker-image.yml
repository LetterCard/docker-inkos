name: Build InkOS Docker

on:
  # 仅镜像内容变更（Dockerfile / entrypoint / .dockerignore）才重建；
  # CI 工具版本升级（dependabot 等）不触发，避免浪费构建
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
  schedule:
    # 每天 UTC 03:00 检测 InkOS 上游新版本
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 避免定时任务与手动/推送构建重叠
concurrency:
  group: build-inkos-docker
  cancel-in-progress: true

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  # ==========================================================
  # Check latest InkOS version
  # ==========================================================
  check-version:
    runs-on: ubuntu-latest
    # 避免 npm / Docker Hub 网络异常导致任务长时间挂起
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Get latest InkOS version
        id: version
        shell: bash
        run: |
          VERSION=$(npm view @actalk/inkos version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ------------------------------------------------------
      # 判断是否需要构建
      # push（Dockerfile / entrypoint 变更）→ 强制重建 latest
      # 定时 / 手动 → 仅当 npm 有新版本且 Docker Hub 尚未发布
      # ------------------------------------------------------
      - name: Check existing image
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            VERSION=${{ steps.version.outputs.version }}
            STATUS=$(curl -s \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}" \
              | grep -o '"name"' || true)

            if [ -z "$STATUS" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  # ==========================================================
  # Docker Build
  # ==========================================================
  docker-build:
    needs:
      - check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version.outputs.version }}
          labels: |
            org.opencontainers.image.title=InkOS Docker
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Narcooo/inkos
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INKOS_VERSION=${{ needs.check-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
