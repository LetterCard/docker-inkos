name: 构建并发布镜像

on:
  # 定时检测上游（npm）新版本并构建
  schedule:
    - cron: "0 3 * * *"
  # 手动触发（含 README 同步）
  workflow_dispatch:
    inputs:
      force:
        description: "强制重建 (忽略版本比对，直接构建当前跟踪版本)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # 推送到 GitHub Container Registry (ghcr.io) 必需
  packages: write

# 避免定时任务与手动/推送构建重叠
concurrency:
  group: build-inkos
  cancel-in-progress: true

env:
  IMAGE_NAME: bugseeker/inkos
  GHCR_IMAGE: lettercard/inkos

jobs:
  # ========== 阶段 1: 检查远程版本 ==========
  check-version:
    name: 检查远程版本
    runs-on: ubuntu-latest
    # 避免 npm / Docker Hub 网络异常导致任务长时间挂起
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 获取 InkOS 最新版本
        id: version
        shell: bash
        run: |
          VERSION=$(npm view @actalk/inkos version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ------------------------------------------------------
      # 判断是否需要构建：Docker Hub 已有与上游相同版本 → 跳过
      # ------------------------------------------------------
      - name: 检查镜像是否已存在
        id: check
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # 强制重建：忽略版本比对，直接构建当前跟踪版本
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "🔨 强制重建，跳过版本比对"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # -f：HTTP 404（标签不存在）即失败 → 需要构建；200（已存在）→ 跳过
          if curl -sf \
            "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}" \
            >/dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # ========== 阶段 2: 冒烟测试 ==========
  smoke-test:
    name: 冒烟测试
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    # 构建可裁剪大量前端依赖，先构建 amd64 并启动镜像验证 Studio 与 CLI，
    # 通过后才进入分架构构建推送，保证 Registry 上不会出现坏镜像
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建 (amd64, 不推送)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            INKOS_VERSION=${{ needs.check-version.outputs.version }}
          tags: inkos-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动并验证 Studio + CLI
        shell: bash
        run: |
          # --network host：共享宿主机网络，直接访问 4567，避免固定端口被占用
          docker run -d --name inkos-smoke --network host inkos-smoke:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4567/ >/dev/null 2>&1; then
              echo "Studio HTTP OK"
              # CLI 自检：HTTP 200 只验证了服务端，CLI 才是受裁剪影响最大的面
              echo "--- CLI check: inkos --version ---"
              docker exec inkos-smoke inkos --version
              echo "--- CLI check: inkos --help (head) ---"
              docker exec inkos-smoke inkos --help | head -5
              docker logs inkos-smoke 2>&1 | tail -5
              docker rm -f inkos-smoke >/dev/null 2>&1
              exit 0
            fi
            sleep 2
          done
          echo "Studio failed to respond within 60s" >&2
          docker logs inkos-smoke 2>&1 | tail -30
          docker rm -f inkos-smoke >/dev/null 2>&1
          exit 1

  # ========== 阶段 3: 分架构并行构建 (amd64 / arm64) ==========
  build-amd64:
    name: 构建并推送 amd64
    runs-on: ubuntu-latest
    needs: [check-version, smoke-test]
    if: needs.check-version.outputs.changed == 'true'
    # 依赖树较大，npm install 耗时长，防止网络异常挂起
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 准备镜像路径
        id: images
        shell: bash
        run: |
          echo "ghcr=ghcr.io/${{ env.GHCR_IMAGE }}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 amd64 (中间标签)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            INKOS_VERSION=${{ needs.check-version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:amd64
            ${{ steps.images.outputs.ghcr }}:amd64
          labels: |
            org.opencontainers.image.title=InkOS Docker
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Narcooo/inkos
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    name: 构建并推送 arm64
    runs-on: ubuntu-latest
    needs: [check-version, smoke-test]
    if: needs.check-version.outputs.changed == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 准备镜像路径
        id: images
        shell: bash
        run: |
          echo "ghcr=ghcr.io/${{ env.GHCR_IMAGE }}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 arm64 (中间标签)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            INKOS_VERSION=${{ needs.check-version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:arm64
            ${{ steps.images.outputs.ghcr }}:arm64
          labels: |
            org.opencontainers.image.title=InkOS Docker
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Narcooo/inkos
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 阶段 4: 合并多架构清单 + 扫描 + 摘要 ==========
  merge-manifest:
    name: 合并多架构镜像清单
    runs-on: ubuntu-latest
    needs: [check-version, build-amd64, build-arm64]
    if: needs.check-version.outputs.changed == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 准备镜像路径
        id: images
        shell: bash
        run: |
          echo "ghcr=ghcr.io/${{ env.GHCR_IMAGE }}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 合并清单 (version + latest)
        shell: bash
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          DH="${{ env.IMAGE_NAME }}"
          GH="${{ steps.images.outputs.ghcr }}"
          # 将单架构中间镜像合并为多架构清单（amd64 / arm64 并行构建后汇合）
          docker buildx imagetools create -t "${DH}:${VERSION}" -t "${DH}:latest" "${DH}:amd64" "${DH}:arm64"
          docker buildx imagetools create -t "${GH}:${VERSION}" -t "${GH}:latest" "${GH}:amd64" "${GH}:arm64"

      # ------------------------------------------------------
      # 漏洞扫描（报告模式，不阻断自动更新；README 声明此项，予以补齐）
      # ------------------------------------------------------
      - name: Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.check-version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # ------------------------------------------------------
      # 构建报告：写入 Actions 页面 Summary（README 徽章展示实时状态）
      # ------------------------------------------------------
      - name: 写入构建摘要
        shell: bash
        run: |
          {
            echo "## 🏗️ InkOS 构建完成"
            echo ""
            echo "- **版本**：\`${{ needs.check-version.outputs.version }}\`"
            echo "- **架构**：linux/amd64 + linux/arm64（并行构建后合并）"
            echo "- **推送**：Docker Hub \`${{ env.IMAGE_NAME }}\`、GHCR \`${{ steps.images.outputs.ghcr }}\`"
            echo "- **标签**：\`latest\`、\`${{ needs.check-version.outputs.version }}\`"
            echo "- **提交**：\`${{ github.sha }}\`"
            echo "- **构建时间**：${{ steps.images.outputs.time }}"
            echo ""
            echo "> 冒烟测试（HTTP + CLI）已通过后才推送；漏洞扫描见上方 Trivy 步骤日志。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ========== 同步 Docker Hub 说明 (合并自 readme.yml；仅手动触发时执行，自动调度时跳过) ==========
  sync-readme:
    name: 同步 Docker Hub 说明
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 同步 Docker Hub 描述
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
