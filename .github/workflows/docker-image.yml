name: Build InkOS Docker

on:
  # 仅两种情况触发构建：
  #   1. 定时检测到上游（npm）发布新版本，且 Docker Hub 尚无该版本
  #   2. 手动触发（workflow_dispatch），同样按上述条件判断
  # 其余文件变更一律不触发，避免浪费构建
  schedule:
    # 每天 UTC 03:00 检测 InkOS 上游新版本
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 避免定时任务与手动/推送构建重叠
concurrency:
  group: build-inkos-docker
  cancel-in-progress: true

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  # ==========================================================
  # Check latest InkOS version
  # ==========================================================
  check-version:
    runs-on: ubuntu-latest
    # 避免 npm / Docker Hub 网络异常导致任务长时间挂起
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Get latest InkOS version
        id: version
        shell: bash
        run: |
          VERSION=$(npm view @actalk/inkos version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ------------------------------------------------------
      # 判断是否需要构建：Docker Hub 已有与上游相同版本 → 跳过
      # ------------------------------------------------------
      - name: Check existing image
        id: check
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # -f：HTTP 404（标签不存在）即失败 → 需要构建；200（已存在）→ 跳过
          if curl -sf \
            "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}" \
            >/dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # ==========================================================
  # Docker Build
  # ==========================================================
  docker-build:
    needs:
      - check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # 依赖树较大，npm install 耗时长，防止网络异常挂起
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version.outputs.version }}
          labels: |
            org.opencontainers.image.title=InkOS Docker
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Narcooo/inkos
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INKOS_VERSION=${{ needs.check-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------
      # 漏洞扫描（报告模式，不阻断自动更新；README 声明此项，予以补齐）
      # ------------------------------------------------------
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.check-version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

  # ==========================================================
  # Smoke test
  # 构建后可裁剪大量前端依赖，这里启动镜像验证 Studio 可正常服务，
  # 防止上游新版本改变依赖结构后静默构建出坏镜像
  # ==========================================================
  smoke-test:
    needs:
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push, cache from gha)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            INKOS_VERSION=${{ needs.check-version.outputs.version }}
          tags: inkos-smoke:latest
          cache-from: type=gha

      - name: Run and verify Studio
        shell: bash
        run: |
          docker run -d --name inkos-smoke -p 14567:4567 inkos-smoke:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:14567/ >/dev/null 2>&1; then
              echo "Studio HTTP OK"
              docker logs inkos-smoke 2>&1 | tail -5
              docker rm -f inkos-smoke >/dev/null 2>&1
              exit 0
            fi
            sleep 2
          done
          echo "Studio failed to respond within 60s" >&2
          docker logs inkos-smoke 2>&1 | tail -30
          docker rm -f inkos-smoke >/dev/null 2>&1
          exit 1
