name: Build InkOS Docker

on:
  schedule:
    # 每天 UTC 03:00
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  # ==========================================================
  # Check latest InkOS version
  # ==========================================================
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.compare.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get latest InkOS version
        id: version
        shell: bash
        run: |
          VERSION=$(npm view @actalk/inkos version)
          echo "Latest InkOS version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compare version
        id: compare
        shell: bash
        run: |
          CURRENT=$(cat VERSION 2>/dev/null || echo "0.0.0")
          LATEST=${{ steps.version.outputs.version }}

          echo "Current: $CURRENT"
          echo "Latest : $LATEST"

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update VERSION and CHANGELOG
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DATE=$(date +"%Y-%m-%d")

          echo "$VERSION" > VERSION

          if [ -f CHANGELOG.md ]; then
            cat > /tmp/header <<EOF
          # InkOS $VERSION
          Release Date: $DATE
          EOF

            cat /tmp/header CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          fi

          git config user.name github-actions
          git config user.email actions@github.com

          git add VERSION CHANGELOG.md

          git commit \
            -m "Update InkOS version $VERSION"

          git push

  # ==========================================================
  # Docker Build
  # ==========================================================
  docker-build:
    needs:
      - check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docker repository
        uses: actions/checkout@v5

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version.outputs.version }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INKOS_VERSION=${{ needs.check-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Narcooo/inkos
          cache-from: type=gha
          cache-to: type=gha,mode=max
