name: Build InkOS Docker

on:
  # 每天凌晨检查一次上游更新
  schedule:
    - cron: "0 3 * * *"

  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  # =====================================================
  # 检查 InkOS 上游版本
  # =====================================================
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone InkOS upstream
        run: |
          git clone \
            --depth=100 \
            https://github.com/Narcooo/inkos.git upstream

      - name: Detect version
        id: version
        run: |
          cd upstream

          # 优先读取 Git Tag
          VERSION=$(git describe \
            --tags \
            --abbrev=0 \
            2>/dev/null || true)

          # fallback package.json
          if [ -z "$VERSION" ]; then
            VERSION=$(jq -r .version package.json)
            VERSION="v${VERSION}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compare version
        id: check
        run: |
          OLD=$(cat VERSION)
          NEW=${{ steps.version.outputs.version }}

          echo "Current: $OLD"
          echo "Latest: $NEW"

          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update VERSION
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.version.outputs.version }}" > VERSION
          git config user.name github-actions
          git config user.email actions@github.com
          git add VERSION
          git commit -m "Update InkOS ${{ steps.version.outputs.version }}"
          git push

  # =====================================================
  # Docker Build & Push
  # =====================================================
  docker-build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bugseeker/inkos
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version.outputs.version }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
