name: InkOS Security Scan

on:
  workflow_run:
    workflows:
      - Build InkOS Docker
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  security:

    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Prepare reports directory
        run: |
          mkdir -p security-reports


      # -------------------------
      # Trivy Vulnerability Report
      # -------------------------

      - name: Trivy Scan Report
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          output: security-reports/trivy-report.md
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      # -------------------------
      # Trivy SARIF Report
      # -------------------------

      - name: Trivy SARIF
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      - name: Upload GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


      # -------------------------
      # SBOM
      # -------------------------

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: security-reports/sbom.spdx.json


      # -------------------------
      # Security Status
      # -------------------------

      - name: Generate Security Status
        shell: bash
        run: |
          cat > security-reports/security-status.md <<'EOF'
# Security Status

Image:

`${IMAGE_NAME}:latest`

Scan Date:

SCAN_DATE_PLACEHOLDER

Status:

✅ Completed

Checks:

- ✅ Trivy vulnerability scan
- ✅ GitHub Security SARIF upload
- ✅ SBOM generated

Reports:

- trivy-report.md
- sbom.spdx.json

EOF

          sed -i "s/SCAN_DATE_PLACEHOLDER/$(date +"%Y-%m-%d")/" security-reports/security-status.md


      # -------------------------
      # Verify Reports
      # -------------------------

      - name: Check Reports
        run: |
          ls -lah security-reports


      # -------------------------
      # Commit Reports
      # -------------------------

      - name: Commit Security Reports
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add security-reports

          git commit -m "Update security reports" || echo "No changes"

          git push origin HEAD:main
