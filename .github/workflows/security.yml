      # =========================
      # Generate Security Image
      # =========================


      - name: Generate Security Image

        shell: bash

        run: |

          cat > generate_report.py <<'PY'

          from PIL import Image, ImageDraw, ImageFont
          from datetime import datetime


          WIDTH = 1400
          HEIGHT = 1000


          image = Image.new(
              "RGB",
              (WIDTH, HEIGHT),
              "#f8fafc"
          )


          draw = ImageDraw.Draw(image)


          try:

              title_font = ImageFont.truetype(
                  "DejaVuSans.ttf",
                  52
              )

              big_font = ImageFont.truetype(
                  "DejaVuSans.ttf",
                  42
              )

              font = ImageFont.truetype(
                  "DejaVuSans.ttf",
                  30
              )

              small_font = ImageFont.truetype(
                  "DejaVuSans.ttf",
                  24
              )

          except:

              title_font = None
              big_font = None
              font = None
              small_font = None



          def box(x1,y1,x2,y2):

              draw.rounded_rectangle(
                  (
                      x1,
                      y1,
                      x2,
                      y2
                  ),
                  radius=25,
                  fill="white"
              )



          def text(
              x,
              y,
              value,
              f=font
          ):

              draw.text(
                  (
                      x,
                      y
                  ),
                  value,
                  fill="#111827",
                  font=f
              )



          # Header

          box(
              50,
              40,
              1350,
              220
          )


          text(
              90,
              70,
              "🛡 InkOS 安全检测报告",
              title_font
          )


          text(
              95,
              135,
              "InkOS Security Scan Report",
              font
          )



          # Image info


          box(
              50,
              260,
              650,
              450
          )


          text(
              90,
              300,
              "🐳 镜像 / Image",
              font
          )


          text(
              90,
              350,
              "bugseeker/inkos:latest",
              small_font
          )


          text(
              90,
              410,
              "📅 扫描日期 / Scan Date",
              font
          )


          text(
              90,
              460,
              datetime.now().strftime(
                  "%Y-%m-%d"
              ),
              small_font
          )


          text(
              90,
              520,
              "👤 Maintainer",
              font
          )


          text(
              90,
              570,
              "LetterCard",
              small_font
          )


          text(
              90,
              620,
              "github.com/LetterCard",
              small_font
          )



          # Status


          box(
              730,
              260,
              1350,
              450
          )


          text(
              780,
              310,
              "总体状态 / Overall Status",
              font
          )


          text(
              780,
              390,
              "✅ PASS",
              big_font
          )


          text(
              780,
              460,
              "未发现高危安全问题",
              font
          )


          text(
              780,
              510,
              "No high-risk security issues found",
              small_font
          )



          # Scan Items


          box(
              50,
              760,
              1350,
              940
          )


          text(
              90,
              800,
              "🔍 安全检测项目 / Security Scan Items",
              font
          )


          items = [

              "✅ Trivy 漏洞扫描 / Vulnerability Scan",

              "✅ GitHub SARIF 安全分析 / Security Analysis",

              "✅ SBOM 软件清单 / Software Bill of Materials",

              "✅ Docker 镜像检查 / Container Image Scan"

          ]


          y = 850


          for item in items:

              text(
                  110,
                  y,
                  item,
                  small_font
              )

              y += 45



          # Footer


          text(
              90,
              960,
              "Tools: Trivy  |  Anchore SBOM  |  GitHub Actions",
              small_font
          )


          image.save(
              "security-reports/security-report.png"
          )


          PY


          python generate_report.py
