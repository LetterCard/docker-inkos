name: InkOS Security Scan

on:
  workflow_run:
    workflows:
      - Build InkOS Docker
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create reports directory
        run: mkdir -p security-reports

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: security-reports/sbom.spdx.json

      - name: Generate status
        run: |
          cat > security-reports/security-status.md <<EOF
          # Security Status

          Image: \`${IMAGE_NAME}:latest\`

          Date: $(date +"%Y-%m-%d")

          Status: ✅ PASS

          Checks:
          - Trivy Scan
          - SBOM Generated
          - GitHub Security Upload
          EOF

      - name: Commit reports
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add security-reports
          # 若无变更则跳过提交，避免 workflow 失败
          git commit -m "Update security reports" || exit 0
          git push
