name: InkOS Security Scan

on:
  workflow_run:
    workflows:
      - Build InkOS Docker
    types:
      - completed

  workflow_dispatch:


permissions:
  contents: write
  security-events: write
  actions: read


env:
  IMAGE_NAME: bugseeker/inkos


jobs:

  security:

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'


    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5



      - name: Create security reports directory
        run: |
          mkdir -p security-reports



      # -------------------------
      # Trivy Vulnerability Scan
      # -------------------------

      - name: Trivy Vulnerability Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          output: security-reports/trivy-report.md
          severity: HIGH,CRITICAL
          ignore-unfixed: true



      # -------------------------
      # Trivy SARIF Upload
      # -------------------------

      - name: Trivy SARIF Report
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true



      - name: Upload SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif



      # -------------------------
      # SBOM Generation
      # -------------------------

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: security-reports/sbom.spdx.json



      # -------------------------
      # Security Status Report
      # -------------------------

      - name: Generate Security Status
        shell: bash
        run: |
          {
            echo "# InkOS Security Report"
            echo
            echo "Image: ${{ env.IMAGE_NAME }}:latest"
            echo
            echo "Scan Date: $(date +"%Y-%m-%d")"
            echo
            echo "Status: Completed"
            echo
            echo "Checks:"
            echo
            echo "- Trivy vulnerability scan"
            echo "- GitHub Security SARIF analysis"
            echo "- SBOM software inventory"
          } > security-reports/security-status.md



      # -------------------------
      # Verify Reports
      # -------------------------

      - name: Verify Security Reports
        run: |
          ls -lah security-reports



      # -------------------------
      # Commit Reports
      # -------------------------

      - name: Commit Security Reports
        shell: bash
        run: |

          git config user.name github-actions
          git config user.email actions@github.com


          git add security-reports


          git commit \
            -m "Update security reports" \
            || echo "No changes"


          git push origin HEAD:main
