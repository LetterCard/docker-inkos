name: InkOS Security Scan

on:
  workflow_run:
    workflows:
      - Build InkOS Docker
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  security-events: write

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  security:

    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Create report folder
        run: mkdir -p security-reports


      - name: Trivy Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bugseeker/inkos:latest
          format: table
          output: security-reports/trivy-report.md
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      - name: Trivy SARIF
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bugseeker/inkos:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL


      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: bugseeker/inkos:latest
          format: spdx-json
          output-file: security-reports/sbom.spdx.json


      - name: Generate Status
        run: |
          echo "# InkOS Security Report" > security-reports/security-status.md
          echo "" >> security-reports/security-status.md
          echo "Image: bugseeker/inkos:latest" >> security-reports/security-status.md
          echo "" >> security-reports/security-status.md
          echo "Status: Completed" >> security-reports/security-status.md
          echo "" >> security-reports/security-status.md
          echo "Generated by GitHub Actions" >> security-reports/security-status.md


      - name: Show Reports
        run: |
          ls -la security-reports


      - name: Commit Reports
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add security-reports

          git commit -m "Update security reports" || true

          git push
