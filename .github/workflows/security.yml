name: InkOS Security Scan

run-name: InkOS Security Scan (${{ github.event_name }})

on:
  workflow_run:
    workflows:
      - Build InkOS Docker
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  security:
    name: Security Scan
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout & Prepare
      # =========================
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare
        run: mkdir -p security-reports

      # =========================
      # Trivy Markdown Report
      # =========================
      - name: Trivy Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          output: security-reports/trivy-report.md
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # =========================
      # Trivy SARIF (for GitHub Code Scanning)
      # =========================
      - name: Trivy SARIF
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # =========================
      # SBOM Generation
      # =========================
      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: security-reports/sbom.spdx.json

      # =========================
      # Extract Image Version
      # =========================
      - name: Get Image Version
        id: version
        shell: bash
        run: |
          VERSION=$(docker image inspect $IMAGE_NAME:latest \
            --format='{{index .Config.Labels "org.opencontainers.image.version"}}' \
            2>/dev/null || echo latest)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # =========================
      # Count Vulnerabilities
      # =========================
      - name: Count Vulnerability
        id: vuln
        shell: bash
        run: |
          HIGH=$(grep -c "HIGH" security-reports/trivy-report.md || true)
          CRITICAL=$(grep -c "CRITICAL" security-reports/trivy-report.md || true)
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      # =========================
      # Generate Security Status Markdown
      # =========================
      - name: Generate Security Status
        shell: bash
        run: |
          if [ "${{ steps.vuln.outputs.critical }}" != "0" ] || \
             [ "${{ steps.vuln.outputs.high }}" != "0" ]; then
            STATUS="⚠️ WARNING"
          else
            STATUS="✅ PASS"
          fi

          cat > security-reports/security-status.md <<EOF
          # InkOS Docker Security Status

          ## Image
          \`${IMAGE_NAME}:latest\`

          ## Version
          \`${{ steps.version.outputs.version }}\`

          ## Scan Date
          $(date +"%Y-%m-%d")

          ## Status
          ${STATUS}

          ## Vulnerabilities

          | Level   | Count |
          |---------|-------|
          | HIGH    | ${{ steps.vuln.outputs.high }} |
          | CRITICAL| ${{ steps.vuln.outputs.critical }} |

          ## Reports
          - ✅ security-report.png
          - ✅ trivy-report.md
          - ✅ sbom.spdx.json
          - ✅ trivy-results.sarif
          EOF

      # =========================
      # Generate Security Report Image
      # =========================
      - name: Install Pillow
        run: pip install pillow

      - name: Generate Security Image
        shell: bash
        run: |
          cat > generate_report.py <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          from datetime import datetime

          WIDTH = 1400
          HEIGHT = 900

          BG = "#0f172a"
          CARD = "#1e293b"
          HEADER = "#334155"

          BLUE = "#38bdf8"
          GREEN = "#4ade80"
          RED = "#f87171"
          YELLOW = "#facc15"

          WHITE = "#f8fafc"
          GRAY = "#94a3b8"

          version = "${{ steps.version.outputs.version }}"
          high = "${{ steps.vuln.outputs.high }}"
          critical = "${{ steps.vuln.outputs.critical }}"

          if int(critical) > 0 or int(high) > 0:
              status = "WARNING"
              status_color = RED
          else:
              status = "PASS"
              status_color = GREEN

          img = Image.new("RGB", (WIDTH, HEIGHT), BG)
          draw = ImageDraw.Draw(img)

          def font(size, bold=False):
              paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
                  if bold else
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              ]
              for p in paths:
                  try:
                      return ImageFont.truetype(p, size)
                  except Exception:
                      pass
              return ImageFont.load_default()

          title_font = font(48, True)
          head_font = font(28, True)
          body_font = font(22)
          small_font = font(18)
          big_font = font(60, True)

          def box(x1, y1, x2, y2):
              draw.rounded_rectangle((x1, y1, x2, y2), radius=18, fill=CARD)

          def text(x, y, t, f, c=WHITE):
              draw.text((x, y), t, font=f, fill=c)

          def center(x1, x2, y, t, f, c):
              w = draw.textbbox((0, 0), t, font=f)[2]
              draw.text(((x1 + x2 - w) // 2, y), t, font=f, fill=c)

          # Top accent line
          draw.rectangle((0, 0, WIDTH, 8), fill=BLUE)

          # Header card
          box(40, 35, WIDTH - 40, 170)
          text(80, 65, "InkOS Docker", title_font)
          text(82, 120, "Security Scan Report", head_font, BLUE)

          # Image info card
          box(40, 210, 650, 520)
          text(70, 240, "Image Information", head_font, BLUE)

          info = [
              ("Image",    "bugseeker/inkos:latest"),
              ("Version",  version),
              ("Scan Date", datetime.now().strftime("%Y-%m-%d")),
              ("Platform", "linux/amd64 + linux/arm64"),
              ("Scanner",  "Trivy + SBOM"),
          ]

          y = 300
          for k, v in info:
              text(70, y, k, small_font, GRAY)
              text(260, y, v, body_font)
              y += 45

          # Security status card
          box(720, 210, 1360, 520)
          text(760, 240, "Security Status", head_font, BLUE)
          center(720, 1360, 320, status, big_font, status_color)
          center(720, 1360, 410, "HIGH", small_font, GRAY)
          center(720, 1360, 445, high, body_font, WHITE)
          center(720, 1360, 510, "CRITICAL", small_font, GRAY)
          center(720, 1360, 545, critical, body_font, WHITE)

          # Footer
          box(40, 760, WIDTH - 40, 840)
          text(70, 795,
               "✓ Trivy Scan    ✓ SARIF    ✓ SBOM    ✓ Dependency Check",
               body_font, GREEN)

          img.save("security-reports/security-report.png")
          print("Security image generated")
          PYEOF

          python generate_report.py

      # =========================
      # Verify & Commit Reports
      # =========================
      - name: Verify Reports
        run: ls -lah security-reports

      - name: Commit Security Reports
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add security-reports
          git diff --cached --quiet && exit 0
          git commit -m "Update InkOS security reports"
          git push origin HEAD:main
