      # =========================
      # Verify
      # =========================

      - name: Verify Reports
        run: ls -lah security-reports



      # =========================
      # Commit
      # =========================

      - name: Commit Security Reports
        shell: bash
        run: |

          git config user.name github-actions

          git config user.email actions@github.com


          git add security-reports


          git commit \
