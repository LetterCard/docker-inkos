name: InkOS Security Scan

on:
  workflow_run:
    workflows:
      - Build InkOS Docker
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

env:
  IMAGE_NAME: bugseeker/inkos

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare reports directory
        run: |
          mkdir -p security-reports

      # -------------------------
      # Trivy Markdown Report
      # -------------------------
      - name: Trivy Scan Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: template
          template: '@/contrib/html.tpl'
          output: security-reports/trivy-report.md
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # -------------------------
      # Trivy SARIF
      # -------------------------
      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # -------------------------
      # SBOM
      # -------------------------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: security-reports/sbom.spdx.json

      # -------------------------
      # Status
      # -------------------------
      - name: Generate security status
        shell: bash
        run: |
          cat > security-reports/security-status.md <<EOF
          # Security Status

          Image:
          \`${IMAGE_NAME}:latest\`

          Scan Date:
          $(date +"%Y-%m-%d")

          Status:
          ✅ PASS

          Checks:
          - ✅ Trivy vulnerability scan
          - ✅ GitHub Security upload
          - ✅ SBOM generated
          EOF

      # -------------------------
      # Commit Reports
      # -------------------------
      - name: Commit security reports
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add security-reports

          git commit -m \
            "Update security reports" || exit 0

          git push
