name: InkOS Security Scan

on:
  workflow_run:
    workflows:
      - Build InkOS Docker
    types:
      - completed

  workflow_dispatch:


permissions:
  contents: write
  security-events: write
  actions: read


env:
  IMAGE_NAME: bugseeker/inkos


jobs:

  security:

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest


    steps:


      # =========================
      # Checkout
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v5



      # =========================
      # Prepare
      # =========================

      - name: Create reports directory
        run: mkdir -p security-reports



      # =========================
      # Trivy Vulnerability Report
      # =========================

      - name: Trivy Vulnerability Report
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          output: security-reports/trivy-report.md
          severity: HIGH,CRITICAL
          ignore-unfixed: true



      # =========================
      # Trivy SARIF
      # =========================

      - name: Trivy SARIF Report
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true



      # =========================
      # GitHub Security
      # =========================

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif



      # =========================
      # SBOM
      # =========================

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: security-reports/sbom.spdx.json



      # =========================
      # Install Pillow
      # =========================

      - name: Install Pillow
        run: pip install pillow



      # =========================
      # Generate Security Image
      # =========================

      - name: Generate Security Image
        shell: bash
        run: |

          cat > generate_report.py <<'PY'

